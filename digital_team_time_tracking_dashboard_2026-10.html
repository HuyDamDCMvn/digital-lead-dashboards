<script>
(function () {
  function csvLabel() {
    var lang = document.documentElement.getAttribute("data-dla-lang")
      || localStorage.getItem("dla-annotation-productivity-lang")
      || localStorage.getItem("dla-annotation-member-lang")
      || "en";
    return lang === "vi" ? "Xuất CSV" : "Export CSV";
  }
  function csvCell(value) {
    var text = String(value == null ? "" : value).replace(/\u00a0/g, " ").trim();

  }

    return String(text || "table")

  }

    if (named) return (String(named).replace(/[^A-Za-z0-9_-]+/g, "-").slice(0, 80) || "table") + ".csv";

    if (container) {
      var h = container.querySelector(".carbon-data-table-container__title, caption");
      if (h) title = h.textContent;

    }
    if (!title) {
      var modalTitle = table.closest("[role='dialog']");
      if (modalTitle) {
        var ht = modalTitle.querySelector("h2, .heat-modal__title, .member-modal__title, .gap-modal__title");
        if (ht) title = ht.textContent;

      if (tr.closest("[hidden]")) return;

    var dialog = table.closest("[role='dialog']");

    var tables = Array.prototype.slice.call(
      dialog.querySelectorAll("table.cds--data-table, table.carbon-data-table, table.gap-modal__table")
    ).filter(function (item) { return !shouldSkip(item); });
    if (tables[0] === table) {
      return dialog.querySelector(".heat-modal__header, .member-modal__header, .gap-modal__actions, .gap-modal__head");
    }
    return null;
  }
  function createButton() {
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "cds--btn cds--btn--tertiary cds--btn--sm dla-csv-export";
    btn.textContent = csvLabel();
    btn.setAttribute("aria-label", csvLabel());
    return btn;
  }
  function bindTable(table) {
    if (shouldSkip(table) || table.dataset.dlaCsvBound === "1") return;
    table.dataset.dlaCsvBound = "1";
    var host = findHost(table);
    var btn = null;
    if (host) {
      btn = host.querySelector(".dla-csv-export, #gap-modal-export-csv");
    }
    if (!btn) {
      btn = createButton();
      if (host) {

          bar = document.createElement("div");
          bar.className = "dla-table-export-bar";
          if (wrap && wrap.parentNode) wrap.parentNode.insertBefore(bar, wrap);
          else table.parentNode.insertBefore(bar, table);
        }
        bar.appendChild(btn);
      }
    }
    if (btn.dataset.dlaCsvClick === "1") return;
    btn.dataset.dlaCsvClick = "1";

      var csv = tableToCsv(table);
      if (!csv) return;
      downloadCsv(tableFilename(table), csv);
    });

    document.querySelectorAll("table.cds--data-table, table.carbon-data-table, table.gap-modal__table").forEach(bindTable);

<style id="dla-motion-style">
/* =====================================================================
   dla_motion.css: shared motion + UX layer, emitted by dashboard_assistant/dla_theme.py
   after the Carbon base CSS on every DLA page and the Control Center.
   Ported from the DashBoard Creator prototype (approved by hu.dam 31/10).
   Rules: transform/opacity only for movement; colour-only under
   prefers-reduced-motion; no bounce, spin, parallax or looping.
   ===================================================================== */
:root {
  /* Carbon motion tokens */
  --dla-ease-productive-standard: cubic-bezier(0.2, 0, 0.38, 0.9);
  --dla-ease-productive-entrance: cubic-bezier(0, 0, 0.38, 0.9);
  --dla-ease-productive-exit: cubic-bezier(0.2, 0, 1, 0.9);
  --dla-ease-expressive-standard: cubic-bezier(0.4, 0.14, 0.3, 1);
  --dla-ease-expressive-entrance: cubic-bezier(0, 0, 0.3, 1);
  --dla-ease-expressive-exit: cubic-bezier(0.4, 0.14, 1, 1);
  --dla-dur-fast-01: 70ms;
  --dla-dur-fast-02: 110ms;
  --dla-dur-moderate-01: 150ms;
  --dla-dur-moderate-02: 240ms;
  --dla-dur-tween: 300ms;          /* KPI number tween + chart data update */
  --dla-stagger: 40ms;
  --dla-enter-distance: 8px;
}

/* ---------- 1. Load entrance (first paint only; html.dla-motion-enter is removed by JS) ---------- */
@keyframes dla-enter { from { opacity: 0; transform: translateY(var(--dla-enter-distance)); } to { opacity: 1; transform: none; } }
@keyframes dla-fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes dla-soft-in { from { opacity: 0.45; } to { opacity: 1; } }
@keyframes dla-slide-in { from { opacity: 0; translate: 0 -4px; } to { opacity: 1; translate: 0 0; } }

html.dla-motion-enter [data-dla-enter] {
  animation: dla-enter var(--dla-dur-moderate-02) var(--dla-ease-expressive-entrance) backwards;
  animation-delay: calc(var(--dla-i, 0) * var(--dla-stagger));
}
html.dla-motion-enter .cc-catalog-section,
html.dla-motion-enter .cc-viewer-section { animation: dla-fade-in var(--dla-dur-moderate-02) var(--dla-ease-productive-entrance) backwards; }

/* ---------- 2. KPI number tween (real text stays in the DOM; overlay is aria-hidden) ---------- */
/* The counting number is a pseudo-element, so copy, textContent and innerText only ever see the real value. */
.carbon-kpi__value.dla-tween { position: relative; color: transparent !important; }
.carbon-kpi__value.dla-tween > * { visibility: hidden; }
.carbon-kpi__value.dla-tween::after {
  content: attr(data-dla-ghost);
  position: absolute; inset: 0; pointer-events: none; white-space: nowrap;
  color: var(--dla-ghost-color, currentColor);
  font: inherit; letter-spacing: inherit; font-variant-numeric: tabular-nums;
}
.carbon-kpi__value { font-variant-numeric: tabular-nums; }

/* ---------- 3. Data swap: charts + tables ---------- */
.dla-swap { animation: dla-soft-in var(--dla-dur-moderate-01) var(--dla-ease-productive-standard) backwards; }
.dla-chart-swap { animation: dla-fade-in var(--dla-dur-moderate-02) var(--dla-ease-productive-standard) backwards; }

/* ---------- 4. Hover / press (70-110 ms) ---------- */
tr.clickable, .tt-project-table tr, .carbon-data-table tbody tr {
  transition: background-color var(--dla-dur-fast-01) var(--dla-ease-productive-standard);
}
.carbon-btn, .cell-button, .carbon-filter-tag__dismiss, .tt-kpi-info__btn, .dla-date-trigger, .dla-date-clear,
.dla-pagination__btn, .cc-period-filter__reset, .tt-filtered-banner button {
  transition: background-color var(--dla-dur-fast-02) var(--dla-ease-productive-standard),
              color var(--dla-dur-fast-02) var(--dla-ease-productive-standard),
              border-color var(--dla-dur-fast-02) var(--dla-ease-productive-standard),
              transform var(--dla-dur-fast-01) var(--dla-ease-productive-standard);
}
.carbon-btn:active, .cell-button:active, .dla-pagination__btn:active:not(:disabled),
.carbon-filter-tag__dismiss:active, .dla-date-trigger:active { transform: scale(0.97); }
tr.clickable:active > * { opacity: 0.8; }
.carbon-tile, .carbon-kpi { transition: background-color var(--dla-dur-fast-02) var(--dla-ease-productive-standard); }

/* ---------- 5. Panels: Avg note, calendar, filter banner/chips ---------- */
/* Avg note: placement uses inline style.transform, so movement uses the separate `translate` property. */
.tt-kpi-info__tip {
  opacity: 0; translate: 0 -4px;
  transition: opacity var(--dla-dur-fast-02) var(--dla-ease-productive-exit),
              translate var(--dla-dur-fast-02) var(--dla-ease-productive-exit),
              display var(--dla-dur-fast-02) allow-discrete;
}
.tt-kpi-info:hover .tt-kpi-info__tip,
.tt-kpi-info:focus-within .tt-kpi-info__tip,
.tt-kpi-info.is-open .tt-kpi-info__tip {
  opacity: 1; translate: 0 0;
  transition-duration: var(--dla-dur-moderate-01);
  transition-timing-function: var(--dla-ease-productive-entrance);
}
@starting-style {
  .tt-kpi-info:hover .tt-kpi-info__tip,
  .tt-kpi-info:focus-within .tt-kpi-info__tip,
  .tt-kpi-info.is-open .tt-kpi-info__tip { opacity: 0; translate: 0 -4px; }
}
.tt-kpi-info.is-dismissed .tt-kpi-info__tip { opacity: 0; }

/* Calendar popup ([hidden] toggled by DlaDatePicker; position uses top/left, not transform) */
.dla-date-popup {
  transition: opacity var(--dla-dur-fast-02) var(--dla-ease-productive-exit),
              translate var(--dla-dur-fast-02) var(--dla-ease-productive-exit),
              display var(--dla-dur-fast-02) allow-discrete;
}
.dla-date-popup:not([hidden]) { opacity: 1; translate: 0 0; transition-duration: var(--dla-dur-moderate-01); transition-timing-function: var(--dla-ease-productive-entrance); }
.dla-date-popup[hidden] { opacity: 0; translate: 0 -4px; }
@starting-style { .dla-date-popup:not([hidden]) { opacity: 0; translate: 0 -4px; } }

/* Filter banner + chips: only when they newly appear (JS adds .dla-appear once) */
.dla-appear { animation: dla-slide-in var(--dla-dur-moderate-01) var(--dla-ease-productive-entrance) backwards; }

/* ---------- 6. Theme switch: 150 ms colour transition (allowed under reduced motion) ---------- */
/* Scoped to surfaces (not `*`): a universal transition costs a ~390 ms first frame on TT (≈5k nodes)
   vs ~75 ms baseline. Large surfaces crossfade; small text/table cells switch with them in the same frame. */
html.dla-theme-switching,
html.dla-theme-switching :is(body, .carbon-page, .carbon-page-header, header, nav, aside, main, section,
  .carbon-tile, .carbon-kpi, .carbon-chart-container, .carbon-data-table-wrap, .carbon-filter-panel,
  .tt-compliance-panel, .tt-project, .tt-breakdown, .tt-entries, .cc-viewer-frame-wrap, .cc-sidebar, .dla-pagination) {
  transition-property: background-color, color, border-color !important;
  transition-duration: var(--dla-dur-moderate-01) !important;
  transition-timing-function: var(--dla-ease-productive-standard) !important;
  transition-delay: 0s !important;
}
html[data-carbon-theme="g100"] { background-color: #161616; }
html[data-carbon-theme="g10"] { background-color: #f4f4f4; }

/* ---------- 7. Control Center: frame crossfade, no white flash ---------- */
.cc-viewer-frame-wrap { background: var(--cds-layer-01, var(--cds-background)); }
.cc-viewer-frame-wrap .cc-viewer-frame {

  transition: opacity var(--dla-dur-moderate-02) var(--dla-ease-productive-entrance);
}
.cc-viewer-frame-wrap.is-loading .cc-viewer-frame { visibility: visible; opacity: 0; transition-duration: var(--dla-dur-fast-02); transition-timing-function: var(--dla-ease-productive-exit); }
.cc-viewer-frame-wrap.is-loading .cc-state--loading { animation: dla-fade-in var(--dla-dur-moderate-01) var(--dla-ease-productive-entrance) backwards; }
.cc-period-filter:not([hidden]).dla-appear { animation: dla-slide-in var(--dla-dur-moderate-01) var(--dla-ease-productive-entrance) backwards; }

/* ---------- 8. UX items ---------- */
/* 8a. One "Filtered" banner: when TT is embedded in CC, CC's banner is the single source. */
html.dla-embedded .tt-filtered-banner { display: none !important; }

/* 8b. "Leave Day" never splits mid-word: break only between words. */
/* The day cell is 30 px of content at 1440 (24 px at 390); 13 px bold "Leave" is 35.5 px, which forced
   the old overflow-wrap:anywhere split ("Lea/ve"). Break only between words and size the label to fit. */
.cell-button.leave:not(.half) { padding-inline: 1px; }
.cell-button.leave:not(.half) .cell-hours { overflow-wrap: normal; word-break: normal; hyphens: manual; font-size: 0.6875rem; letter-spacing: 0; }
@media (max-width: 1055px) { .cell-button.leave:not(.half) .cell-hours { font-size: 0.625rem; } }

/* 8c. Carbon-style pagination for the TT details table (TT renders only the current page) */
.dla-pagination {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 0;
  min-height: 48px; border-top: 1px solid var(--cds-border-subtle-01, #393939);
  background: var(--cds-layer-01, transparent); color: var(--cds-text-secondary, #c6c6c6);
  font-size: 0.875rem; line-height: 1.29;

.dla-pagination__left { gap: 8px; padding-left: 16px; }
.dla-pagination__label { white-space: nowrap; }
.dla-pagination select {
  height: 48px; padding: 0 28px 0 12px; border: 0; border-left: 1px solid var(--cds-border-subtle-01, #393939);
  border-right: 1px solid var(--cds-border-subtle-01, #393939);
  background: transparent; color: var(--cds-text-primary, #f4f4f4); font: inherit; cursor: pointer;
}
.dla-pagination select option { background: var(--cds-layer-01, #262626); color: var(--cds-text-primary, #f4f4f4); }
.dla-pagination__range { padding: 0 16px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.dla-pagination__pages { padding: 0 16px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.dla-pagination__btn {
  display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px;
  border: 0; border-left: 1px solid var(--cds-border-subtle-01, #393939); background: transparent;

.dla-pagination__btn:focus-visible, .dla-pagination select:focus-visible { outline: 2px solid var(--cds-focus, #fff); outline-offset: -2px; }
.dla-pagination__btn:disabled { cursor: not-allowed; color: var(--cds-icon-disabled, #8d8d8d); }

@media (max-width: 671px) {

  .dla-pagination__left { padding-left: 8px; }

/* 8d. Work dashboard (WC) 672-1055 px. Root cause: the grid drops to 8 explicit columns at md, but

  html:has(.kpi-provenance) .carbon-grid > .carbon-filter-summary,
  html:has(.kpi-provenance) .carbon-grid > .kpi-cluster-label,
  html:has(.kpi-provenance) .carbon-grid > .kpi-cluster,
  html:has(.kpi-provenance) .carbon-grid > .kpi-provenance,
  html:has(.kpi-provenance) .carbon-grid > .action-queue { grid-column: 1 / -1 !important; min-width: 0; }
  html:has(.kpi-provenance) .carbon-filter-panel .grid.filters {
    grid-template-columns: repeat(2, minmax(0, 1fr)) !important; gap: var(--cds-spacing-05, 1rem);
  }
  html:has(.kpi-provenance) .carbon-filter-panel .filter-field > input,
  html:has(.kpi-provenance) .carbon-filter-panel .filter-field > select { width: 100%; max-width: 100%; min-width: 0; box-sizing: border-box; }
  html:has(.kpi-provenance) .carbon-filter-panel .filter-actions { grid-column: 1 / -1; }

/* ---------- 9. Reduced motion: colour change only ---------- */
@media (prefers-reduced-motion: reduce) {

  .dla-swap, .dla-chart-swap, .dla-appear, .cc-state--loading { animation: none !important; }
  .carbon-btn:active, .cell-button:active, .dla-pagination__btn:active, .carbon-filter-tag__dismiss:active, .dla-date-trigger:active { transform: none !important; }
  .tt-kpi-info__tip, .dla-date-popup { translate: none !important; transition: none !important; }
  .tt-kpi-info:hover .tt-kpi-info__tip, .tt-kpi-info:focus-within .tt-kpi-info__tip, .tt-kpi-info.is-open .tt-kpi-info__tip, .dla-date-popup:not([hidden]) { opacity: 1 !important; }

  html.dla-theme-switching :is(body, .carbon-page, .carbon-page-header, header, nav, aside, main, section,
    .carbon-tile, .carbon-kpi, .carbon-chart-container, .carbon-data-table-wrap, .carbon-filter-panel,
    .tt-compliance-panel, .tt-project, .tt-breakdown, .tt-entries, .cc-viewer-frame-wrap, .cc-sidebar, .dla-pagination) {

/* ---------- 10. Shared toggletip (.dla-tip) + "Data as of" chip ---------- */
.dla-tip { position: relative; display: inline-flex; vertical-align: middle; margin-left: 4px; }
.dla-tip__btn {
  display: inline-flex; align-items: center; justify-content: center;
  width: 24px; height: 24px; padding: 0; border: 0; background: transparent; cursor: pointer;
  color: var(--cds-icon-secondary, var(--cds-text-secondary));
}
.dla-tip__btn svg { fill: currentColor; }
.dla-tip__btn:hover { color: var(--cds-text-primary); }
.dla-tip__btn:focus-visible { outline: 2px solid var(--cds-focus); outline-offset: -2px; }
