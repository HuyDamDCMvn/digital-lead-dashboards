          const halfLeaveOnTarget = isHalfLeave && isHalfLeaveTargetHours(hours);
          const onTarget = isNotYet || isOffday || isLeave || halfLeaveOnTarget || isPending || (!isHalfLeave && isExactTargetHours(hours));
          const offTarget = (isOffday || isLeave || isPending || onTarget) ? 0 : (isHalfLeave ? Math.abs(hours - halfTarget) : Math.abs(hours - TARGET));
          return {
            isNotYet,
            offTarget,
            day: meta.day,
            weekday: meta.weekday,
            isOffday,
            isLeave,
            isHalfLeave,
            halfLeaveOnTarget,
            isPending,
            hours,
            onTarget,
            offdayLabel,
            gapLabel: isNotYet
              ? "Not yet on team (joined " + fmtIsoDate(memberActiveFrom(member.username)) + ")"
              : complianceGapLabel(hours, isOffday, isLeave, isHalfLeave, isPending, offdayLabel)
          };
        });
        return {
          username: member.username,
          name: member.realname || member.username,
          totalHours: days.reduce((sum, item) => sum + item.hours, 0),
          offTargetHours: days.reduce((sum, item) => sum + item.offTarget, 0),
          days
        };
      });
    }

    /* CSV value of one daily-compliance cell: what the grid shows, with a holiday named instead of "—". */
    function complianceCsvValue(item, cellLabel) {
      if (item.isNotYet || item.isLeave) return cellLabel;
      if (item.isHalfLeave) return cellLabel + " Half Leave";
      if (item.isOffday) return item.offdayLabel || cellLabel;
      return cellLabel;
    }

    /* Year page: more than 31 days shows weekly cells (up to 92 days) or monthly cells; a cell drills down to its days. */
    function complianceBuckets(days) {
      const mode = days.length > 92 ? "month" : "week";
      const buckets = [];
      days.forEach((meta) => {
        const key = mode === "month" ? meta.day.slice(0, 7) : isoDateAddDays(meta.day, -((meta.weekday + 6) % 7));
        let bucket = buckets.length ? buckets[buckets.length - 1] : null;
        if (!bucket || bucket.key !== key) {
          bucket = { key: key, from: meta.day, to: meta.day };
          buckets.push(bucket);
        }
        bucket.to = meta.day;
      });
      buckets.forEach((bucket) => {
        bucket.label = mode === "month" ? monthLongName(bucket.from).slice(0, 3) : ddMm(bucket.from);
        bucket.title = mode === "month"
          ? monthLongName(bucket.from) + " " + bucket.from.slice(0, 4) + " (" + ddMm(bucket.from) + "–" + ddMm(bucket.to) + ")"
          : "week " + ddMm(bucket.from) + "–" + ddMm(bucket.to);
      });
      return { mode: mode, buckets: buckets };
    }

    function aggregateComplianceCell(row, bucket) {
      const items = row.days.filter((item) => item.day >= bucket.from && item.day <= bucket.to);
      const logged = items.reduce((sum, item) => sum + item.hours, 0);
      const due = items.filter((item) => !item.isNotYet && !item.isOffday && !item.isPending);
      const expected = due.reduce((sum, item) => sum + availabilityWeight(row.username, item.day) * TARGET, 0);
      const off = items.reduce((sum, item) => sum + item.offTarget, 0);
      const workdays = items.filter((item) => !item.isOffday && !item.isNotYet);
      if (items.length && items.every((item) => item.isNotYet)) {
        return { cls: "notyet", label: "Not yet", gap: "", tip: "Not yet on team (joined " + fmtIsoDate(memberActiveFrom(row.username)) + ")" };
      }
      if (workdays.length && workdays.every((item) => item.isPending)) {
        return { cls: "pending", label: "Pending", gap: "", tip: "Not due yet" };
      }
      if (expected <= 0 && logged <= 0) {
        return { cls: "offday", label: "—", gap: "", tip: "No workday due (leave, holiday or weekend)" };
      }
      if (off < HOURS_MATCH_EPSILON) {
        return { cls: "ok", label: fmtHours(logged), gap: "of " + fmtHours(expected), tip: fmtHours(logged) + " h logged of " + fmtHours(expected) + " h expected; every workday on target" };
      }
      return { cls: "miss", label: fmtHours(logged), gap: "off " + fmtHours(off), tip: fmtHours(logged) + " h logged of " + fmtHours(expected) + " h expected; " + fmtHours(off) + " h off target" };
    }

    function aggregatedComplianceHtml(compliance, grid, filters) {
      const width = 72 + grid.buckets.length * 68;
      const head = grid.buckets.map((bucket) => `<th scope="col" data-dla-csv-value="${esc(bucket.label)}"><button type="button" class="tt-bucket-head" data-range="${esc(bucket.from)}|${esc(bucket.to)}" aria-label="Show ${esc(bucket.title)} day by day" title="Show ${esc(bucket.title)} day by day">${esc(bucket.label)}</button></th>`).join("");
      const body = compliance.map((row) => `<tr><th scope="row">${esc(row.name)}</th>${grid.buckets.map((bucket) => {
        const cell = aggregateComplianceCell(row, bucket);
        const active = filters.user === row.username;
        return `<td data-dla-csv-value="${esc(cell.gap ? cell.label + " " + cell.gap : cell.label)}"><button type="button" class="cell-button cell-button--agg ${cell.cls}${active ? " active" : ""}" data-user-range="${esc(row.username)}|${esc(bucket.from)}|${esc(bucket.to)}" title="${esc(cell.tip)}" aria-label="${esc(row.name)} ${esc(bucket.title)}: ${esc(cell.tip)}. Show days."><div class="cell-hours">${esc(cell.label)}</div>${cell.gap ? `<div class="cell-gap">${esc(cell.gap)}</div>` : ""}</button></td>`;
      }).join("")}</tr>`).join("");
      return `<div class="compliance-wrap"><table class="compliance compliance--agg carbon-data-table"${csvNameAttr(grid.mode === "month" ? "tt-monthly" : "tt-weekly")} aria-label="${grid.mode === "month" ? "Monthly" : "Weekly"} compliance by member" style="min-width:${width}px"><colgroup><col class="user-col">${grid.buckets.map(() => `<col class="day-col agg-col">`).join("")}</colgroup><thead><tr><th scope="col">User</th>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
    }

    /* Year page trend: every weekday up to as-of (0 h when nothing was logged), weekends only with logs; weekly points above 92 days. */
    function yearTrendSeries(filters, entries, ref) {
      const byDay = new Map();
      entries.forEach((row) => {
        const day = normalizeDayKey(row.day);
        byDay.set(day, asNumber(byDay.get(day)) + asNumber(row.hours));
      });
      const last = filters.to < ref.asOfDay ? filters.to : ref.asOfDay;
      const calendar = calendarDaysForFilters(filters);
      const daily = calendar
        .filter((meta) => meta.day <= last && ((meta.weekday >= 1 && meta.weekday <= 5) || asNumber(byDay.get(meta.day)) > 0))
        .map((meta) => {
          const weekend = meta.weekday === 0 || meta.weekday === 6;
          const holiday = specialOffdayLabel(meta.day);
          const g = ref.ghost ? ref.ghost.valueFor(meta.day) : null;
          return {
            day: meta.day,
            to: meta.day,
            label: fmtIsoDate(meta.day),
            hours: asNumber(byDay.get(meta.day)),
            cap: ref.capacityFor ? ref.capacityFor(meta.day) : null,
            ghost: g ? g.hours : null,
            ghostDay: g ? g.day : "",
            offLabel: holiday ? holiday + " (holiday)" : weekend ? "Weekend with logs" : "",
            filling: Boolean(ref.fillFrom) && meta.day >= ref.fillFrom && meta.day <= ref.asOfDay
          };
        });
      if (calendar.length <= 92) return daily;
      const weeks = [];
      daily.forEach((p) => {
        const meta = { day: p.day, weekday: isoDateToLocalDate(p.day).getDay() };
        const key = isoDateAddDays(p.day, -((meta.weekday + 6) % 7));
        let w = weeks.length ? weeks[weeks.length - 1] : null;
        if (!w || w.key !== key) {
          w = { key: key, day: p.day, to: p.day, hours: 0, cap: ref.capacityFor ? 0 : null, ghost: null, ghostDay: "", offs: [], filling: false };
          weeks.push(w);
        }
        w.to = p.day;
        w.hours += p.hours;
        if (w.cap !== null) w.cap += asNumber(p.cap);
        if (p.ghost !== null) w.ghost = asNumber(w.ghost) + p.ghost;
        if (p.offLabel && p.offLabel !== "Weekend with logs") w.offs.push(ddMm(p.day) + " " + p.offLabel);
        w.filling = w.filling || p.filling;
      });
      /* The label names the calendar week (Mon–Sun) clipped to the selected range, not only the days with points. */
      const weekLabel = (w) => {
        const start = w.key < filters.from ? filters.from : w.key;
        const sunday = isoDateAddDays(w.key, 6);
        const end = sunday > filters.to ? filters.to : sunday;
        return "Week " + ddMm(start) + "–" + ddMm(end);
      };
      return weeks.map((w) => ({ day: w.day, to: w.to, label: weekLabel(w), hours: w.hours, cap: w.cap, ghost: w.ghost, ghostDay: "", offLabel: w.offs.join("; "), filling: w.filling }));
    }

    const CHART_COLORS = ["#6929c4","#1192e8","#005d5d","#9f1853","#fa4d56","#570408","#198038","#002d9c","#b28600","#009d9a","#012749","#8a3800"];
    let projectChart = null;
    let dailyTrendChart = null;
    let memberChart = null;

    function destroyChart(instance) {
      if (instance && typeof instance.destroy === "function") instance.destroy();
    }

    function carbonKpiTile(label, value, subtitle, titleAttr) {
      const subtitleHtml = subtitle ? `<p class="carbon-kpi__subtitle">${esc(subtitle)}</p>` : "";
      const titleHtml = titleAttr ? ` title="${esc(titleAttr)}"` : "";
      return `<article class="carbon-tile carbon-tile--span-4 carbon-kpi"${titleHtml}><p class="carbon-kpi__label">${esc(label)}</p><p class="carbon-kpi__value">${esc(value)}</p>${subtitleHtml}</article>`;
    }

    /* KPI with a rule note reachable by hover, keyboard focus, tap and screen readers. */
    function carbonKpiInfoTile(label, value, subtitle, note, idBase) {
      const subtitleHtml = subtitle ? `<p class="carbon-kpi__subtitle">${esc(subtitle)}</p>` : "";
      const tipId = idBase + "-tip";
      const info = `<span class="tt-kpi-info${avgInfoOpen ? " is-open" : ""}"><button type="button" class="tt-kpi-info__btn" id="${idBase}" aria-label="About ${esc(label)}" aria-describedby="${tipId}" aria-expanded="${avgInfoOpen ? "true" : "false"}" aria-controls="${tipId}"><svg focusable="false" aria-hidden="true" width="16" height="16" viewBox="0 0 32 32" fill="currentColor"><path d="M17 22v-8h-4v2h2v6h-3v2h8v-2h-3zM16 8a1.5 1.5 0 1 0 1.5 1.5A1.5 1.5 0 0 0 16 8z"/><path d="M16 30a14 14 0 1 1 14-14 14 14 0 0 1-14 14zm0-26a12 12 0 1 0 12 12A12 12 0 0 0 16 4z"/></svg></button><span class="tt-kpi-info__tip" role="tooltip" id="${tipId}">${esc(note)}</span></span>`;
      return `<article class="carbon-tile carbon-tile--span-4 carbon-kpi"><p class="carbon-kpi__label">${esc(label)}${info}</p><p class="carbon-kpi__value">${esc(value)}</p>${subtitleHtml}</article>`;
    }

    function carbonStatusBadge(status, label) {
      const map = { success: "success", ok: "success", error: "error", miss: "error", warning: "warning", info: "info", pending: "info", neutral: "neutral", leave: "info" };
      const key = map[String(status || "neutral").toLowerCase()] || "neutral";
      return `<span class="carbon-status-badge carbon-status-badge--${key}"><span class="carbon-status-badge__icon" aria-hidden="true"></span><span>${esc(label)}</span></span>`;
    }

    function carbonEmptyState(title, description) {
      return `<div class="carbon-empty-state" role="status"><h2 class="carbon-empty-state__title">${esc(title)}</h2><p class="carbon-empty-state__description">${esc(description)}</p></div>`;
    }

    function carbonChartShell(chartId, title, height) {
      return `<section class="carbon-chart-container"><h2 class="carbon-chart-container__title">${esc(title)}</h2><div id="${esc(chartId)}" class="carbon-chart-container__plot cds--chart-container" style="height:${esc(height)}"></div></section>`;
    }

    function carbonDataTableShell(title, headHtml, bodyHtml, note, afterWrapHtml, csvName) {
      const noteHtml = note ? `<p class="panel-note">${esc(note)}</p>` : "";
      return `<section class="carbon-data-table-container"><div class="carbon-data-table-container__head"><h2 class="carbon-data-table-container__title">${esc(title)}</h2></div>${noteHtml}<div class="carbon-data-table-wrap"><table class="carbon-data-table cds--data-table"${csvName ? csvNameAttr(csvName) : ""}><caption>${esc(title)}</caption><thead>${headHtml}</thead><tbody>${bodyHtml}</tbody></table></div>${afterWrapHtml || ""}</section>`;
    }

    function ttPaginationIcon(d) {
      return `<svg width="16" height="16" viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path d="${d}"/></svg>`;
    }

    /* Window of the details table for the current page; clamps the page number. */
    function ttPageWindow(total) {
      const size = ttPage.size || total || 1;
      const pages = Math.max(1, Math.ceil(total / size));
      if (ttPage.page > pages) ttPage.page = pages;
      if (ttPage.page < 1) ttPage.page = 1;
      const start = (ttPage.page - 1) * size;
      return { start: start, end: Math.min(total, start + size), pages: pages };
    }

    function ttPaginationHtml(total, win) {
      if (total <= TT_PAGE_SIZES[0]) return "";
      const sizeOpts = TT_PAGE_SIZES.map((n) => `<option value="${n}"${n === ttPage.size ? " selected" : ""}>${n ? n : "All"}</option>`).join("");
      let pageOpts = "";
      for (let n = 1; n <= win.pages; n++) pageOpts += `<option value="${n}"${n === ttPage.page ? " selected" : ""}>${n}</option>`;
      return `<div class="dla-pagination cds--pagination" data-dla-motion role="navigation" aria-label="Time Tracking Details pagination">`
        + `<div class="dla-pagination__left"><label class="dla-pagination__label" for="dla-pg-size">Items per page:</label><select id="dla-pg-size">${sizeOpts}</select>`
        + `<span class="dla-pagination__range" aria-live="polite">${total ? win.start + 1 : 0}–${win.end} of ${total} items</span></div>`
        + `<div class="dla-pagination__right"><select id="dla-pg-page" aria-label="Page number, of ${win.pages} pages">${pageOpts}</select>`
        + `<span class="dla-pagination__pages">of ${win.pages} page${win.pages === 1 ? "" : "s"}</span>`
        + `<button type="button" class="dla-pagination__btn" id="dla-pg-prev" aria-label="Previous page"${ttPage.page <= 1 ? " disabled" : ""}>${ttPaginationIcon("M20 24L12 16 20 8 21.4 9.4 14.8 16 21.4 22.6z")}</button>`
        + `<button type="button" class="dla-pagination__btn" id="dla-pg-next" aria-label="Next page"${ttPage.page >= win.pages ? " disabled" : ""}>${ttPaginationIcon("M12 8L20 16 12 24 10.6 22.6 17.2 16 10.6 9.4z")}</button></div></div>`;
    }

    function chartOptions(title, leftTitle, bottomTitle, height) {
      return {
        title: title,
        theme: (window.__dlaTheme || "g100"),
        accessibility: { svgAriaLabel: title },
        axes: {
          left: { mapsTo: "value", title: leftTitle },
          bottom: { mapsTo: "key", title: bottomTitle, scaleType: "labels" },
        },
        height: height || "320px",
      };
    }

    function renderProjectChart(projects, filters) {
      destroyChart(projectChart);
      projectChart = null;
      const host = document.getElementById("chart-project-hours");
      if (!host) return;
      if (!projects.length || typeof Charts === "undefined") {
        host.innerHTML = carbonEmptyState("No project hours in scope", "Clear chart or table filters to widen the scope.");
        return;
      }
      const data = projects.map((row) => ({ group: row.label, value: row.amount }));
      host.innerHTML = "";
      projectChart = new Charts.DonutChart(host, {
        data: data,
        options: {
          title: "Hours by project",
          theme: (window.__dlaTheme || "g100"),
          resizable: true,
          height: "100%",
          donut: { center: { label: "Total hours" }, alignment: "center" },
          pie: { labels: { enabled: false } },
          legend: { enabled: false },
          color: { scale: data.reduce((acc, d, i) => { acc[d.group] = CHART_COLORS[i % CHART_COLORS.length]; return acc; }, {}) },
          tooltip: { valueFormatter: (v) => v.toFixed(2) + "h" },
          accessibility: { svgAriaLabel: "Hours by project donut chart" },
        },
      });
    }

    function buildTrendReference(filters, blockers) {
      const users = filters.user !== "all" ? [filters.user] : DATA.members.map((member) => member.username);
      const lag = logLagStats(YEAR ? DATA.timeEntries.filter((row) => inRange(row, filters.from, filters.to)) : DATA.timeEntries);
      const asOfDay = normalizeDayKey(DATA.dataAsOf) || complianceSnapshotDay(DATA.timeEntries);
      const fillFrom = lag.p90 > 0 ? isoDateAddDays(asOfDay, -(lag.p90 - 1)) : "";
      const workdays = (YEAR ? calendarDaysForFilters(filters) : monthDates()).filter(isWorkday).map((meta) => meta.day);
      const prev = DATA.previousMonth;
      let ghost = null;
      let prevNote = "";
      if (YEAR && !blockers.length) {
        const pp = previousPeriod(filters);
        const joined = filters.user !== "all" ? memberActiveFrom(filters.user) : "";
        if (!pp.available) {
          prevNote = "No previous-period line: the previous period (" + fmtIsoDate(pp.from) + "–" + fmtIsoDate(pp.to) + ") starts before " + fmtIsoDate(YEAR.firstDay) + ", the first published day.";
        } else if (joined && pp.from < joined) {
          prevNote = "No previous-period line: the previous period (" + fmtIsoDate(pp.from) + "–" + fmtIsoDate(pp.to) + ") starts before this member joined on " + fmtIsoDate(joined) + ".";
        } else {
          const prevRows = DATA.timeEntries.filter((row) => inRange(row, pp.from, pp.to));
          const basis = Array.from(new Set(prevRows.filter((row) => asNumber(row.hours) > 0).map((row) => normalizeDayKey(row.day))))
            .filter((day) => { const wd = isoDateToLocalDate(day).getDay(); return wd >= 1 && wd <= 5; })
            .sort();
          const byDay = new Map();
          prevRows.forEach((row) => {
            if (filters.user !== "all" && row.logged_by_username !== filters.user) return;
            const day = normalizeDayKey(row.day);
            byDay.set(day, asNumber(byDay.get(day)) + asNumber(row.hours));
          });
          const total = Array.from(byDay.values()).reduce((sum, v) => sum + v, 0);
          ghost = { name: pp.name, short: pp.short, total: total, valueFor: (day) => {
            const k = workdays.indexOf(day);
            if (k < 0 || k >= basis.length) return null;
            return { day: basis[k], hours: asNumber(byDay.get(basis[k])) };
          } };
        }
      }
      if (!YEAR && prev && Array.isArray(prev.rows) && !blockers.length) {
        const basis = Array.from(new Set(prev.rows.filter((row) => row.hours > 0).map((row) => row.day)))
          .filter((day) => { const wd = isoDateToLocalDate(day).getDay(); return wd >= 1 && wd <= 5; })
          .sort();
        const byDay = new Map();
        prev.rows.forEach((row) => {
          if (filters.user !== "all" && row.user !== filters.user) return;
          byDay.set(row.day, asNumber(byDay.get(row.day)) + asNumber(row.hours));
        });
        const total = Array.from(byDay.values()).reduce((sum, v) => sum + v, 0);
        const name = new Date(String(prev.start).slice(0, 10) + "T00:00:00").toLocaleString("en-US", { month: "long" });
        ghost = { name: name, short: name.slice(0, 3), total: total, valueFor: (day) => {
          const k = workdays.indexOf(day);
          if (k < 0 || k >= basis.length) return null;
          return { day: basis[k], hours: asNumber(byDay.get(basis[k])) };
        } };
      }
      return {
        lag: lag,
        asOfDay: asOfDay,
        fillFrom: fillFrom,
        blockers: blockers,
        capacityFor: blockers.length ? null : (day) => {
          const meta = { day: day, weekday: isoDateToLocalDate(day).getDay() };
          return isWorkday(meta) ? workdayWeight(day, users) * TARGET : 0;
        },
        ghost: ghost,
        prevNote: prevNote
      };
    }

    function renderDailyTrendChart(days, ref) {
      destroyChart(dailyTrendChart);
      dailyTrendChart = null;
      const host = document.getElementById("chart-daily-trend");
      if (!host) return;
      if (!days.length) {
        host.innerHTML = carbonEmptyState("No workdays in scope", "Clear chart or table filters to widen the scope.");
        return;
      }
      const pts = ref.points ? ref.points : days.map((row) => {
        const g = ref.ghost ? ref.ghost.valueFor(row.value) : null;
        return {
          day: row.value,
          hours: asNumber(row.amount),
          cap: ref.capacityFor ? ref.capacityFor(row.value) : null,
          ghost: g ? g.hours : null,
          ghostDay: g ? g.day : "",
          filling: Boolean(ref.fillFrom) && row.value >= ref.fillFrom && row.value <= ref.asOfDay
        };
      });
      const W = Math.max(320, Math.round(host.clientWidth || 640)), H = 240, ml = 44, mr = 12, mt = 16, mb = 28;
      const iw = W - ml - mr, ih = H - mt - mb;
      const peak = Math.max(1, ...pts.map((p) => Math.max(p.hours, p.cap || 0, p.ghost || 0)));
      const stepY = peak > 80 ? 20 : peak > 40 ? 10 : peak > 16 ? 5 : 2;
      const maxY = Math.ceil(peak / stepY) * stepY;
      const n = pts.length;
      const slot = iw / n;
      const x = (i) => ml + slot * (i + 0.5);
      const y = (v) => mt + ih - (v / maxY) * ih;
      const r1 = (v) => Math.round(v * 10) / 10;
      let svg = "";
      for (let v = 0; v <= maxY; v += stepY) {
        svg += `<line class="tt-trend__grid" x1="${ml}" x2="${W - mr}" y1="${r1(y(v))}" y2="${r1(y(v))}"/><text class="tt-trend__axis" x="${ml - 6}" y="${r1(y(v) + 4)}" text-anchor="end">${v}</text>`;
      }
      pts.forEach((p, i) => {
        if (p.offLabel) svg += `<rect class="tt-trend__off" x="${r1(ml + slot * i)}" y="${mt}" width="${r1(slot)}" height="${ih}"><title>${esc((p.label || fmtIsoDate(p.day)) + ": " + p.offLabel)}</title></rect>`;
      });
      const hasOff = pts.some((p) => p.offLabel);
      const firstFill = pts.findIndex((p) => p.filling);
      if (firstFill >= 0) {
        const lastFill = pts.length - 1 - pts.slice().reverse().findIndex((p) => p.filling);
        const fx = ml + slot * firstFill;
        const fw = slot * (lastFill - firstFill + 1);
        svg += `<rect class="tt-trend__fill" x="${r1(fx)}" y="${mt}" width="${r1(fw)}" height="${ih}"/><text class="tt-trend__fill-label" x="${r1(fx + fw / 2)}" y="${mt + ih - 6}" text-anchor="middle">Still filling</text>`;
      }
      const every = Math.max(1, Math.ceil(n / 8));
      pts.forEach((p, i) => {
        if (i % every === 0 || i === n - 1) svg += `<text class="tt-trend__axis" x="${r1(x(i))}" y="${H - 8}" text-anchor="middle">${esc(fmtIsoDate(p.day).slice(0, 5))}</text>`;
      });
      if (ref.capacityFor) {
        let d = "";
        pts.forEach((p, i) => {
          const x0 = ml + slot * i, x1 = x0 + slot, yy = r1(y(p.cap));
          d += (i === 0 ? `M${r1(x0)} ${yy}` : `V${yy}`) + `H${r1(x1)}`;
        });
        svg += `<path class="tt-trend__cap" d="${d}"/>`;
      }
      if (ref.ghost) {
        let d = "";
        let pen = false;
        pts.forEach((p, i) => {
          if (p.ghost === null) { pen = false; return; }
          d += `${pen ? "L" : "M"}${r1(x(i))} ${r1(y(p.ghost))}`;
          pen = true;
        });
        if (d) svg += `<path class="tt-trend__ghost" d="${d}"/>`;
      }
      svg += `<path class="tt-trend__line" d="${pts.map((p, i) => `${i ? "L" : "M"}${r1(x(i))} ${r1(y(p.hours))}`).join("")}"/>`;
      pts.forEach((p, i) => {
        const tip = `${p.label || fmtIsoDate(p.day)}: ${fmtHours(p.hours)} h logged${p.cap !== null ? ` · capacity ${fmtHours(p.cap)} h` : ""}${p.ghost !== null ? ` · ${ref.ghost.short} same workday # ${fmtHours(p.ghost)} h` : ""}${p.offLabel ? " · " + p.offLabel : ""}${p.filling ? " · still filling" : ""}`;
        svg += `<circle class="tt-trend__dot${p.filling ? " tt-trend__dot--filling" : ""}" cx="${r1(x(i))}" cy="${r1(y(p.hours))}" r="3"><title>${esc(tip)}</title></circle>`;
      });
      const total = pts.reduce((sum, p) => sum + p.hours, 0);
      const lag = ref.lag;
      const latePct = lag.n ? Math.round(lag.late / lag.n * 100) : 0;
      const desc = `Logged hours on ${n} ${ref.weekly ? (n === 1 ? "week" : "weeks") : (n === 1 ? "day" : "days")}${ref.points ? " (0 h where nothing was logged)" : ""}, ${fmtHours(total)} h in total${ref.capacityFor ? ", with team capacity" : ""}${ref.ghost ? `, and ${ref.ghost.name} aligned by workday number` : ""}.`;
      const legend = `<ul class="tt-trend-legend"><li><span class="tt-trend-legend__key" aria-hidden="true"></span>Logged</li>${ref.capacityFor ? `<li><span class="tt-trend-legend__key tt-trend-legend__key--cap" aria-hidden="true"></span>Capacity (on duty × ${fmtHours(TARGET)} h)</li>` : ""}${ref.ghost ? `<li><span class="tt-trend-legend__key tt-trend-legend__key--ghost" aria-hidden="true"></span>${esc(ref.ghost.name)}, same workday # (${fmtHours(ref.ghost.total)} h)</li>` : ""}${hasOff ? `<li><span class="tt-trend-legend__key tt-trend-legend__key--off" aria-hidden="true"></span>${ref.weekly ? "Week with a holiday" : "Holiday or weekend with logs"}</li>` : ""}${firstFill >= 0 ? `<li><span class="tt-trend-legend__key tt-trend-legend__key--fill" aria-hidden="true"></span>Still filling</li>` : ""}</ul>`;
      const captionText = `${lag.p90 > 0 && (!ref.points || firstFill >= 0) ? `Shaded: the last ${lag.p90} ${lag.p90 === 1 ? "day" : "days"} up to ${esc(fmtIsoDate(ref.asOfDay).slice(0, 5))} are still filling (${(lag.n ? lag.withinP90 / lag.n * 100 : 0).toFixed(1)} % of entries arrive within ${lag.p90} ${lag.p90 === 1 ? "day" : "days"}). ` : ""}${lag.late > 0 ? `≈${latePct} % of entries arrive ${lateSpanText(lag)} late (${fmtInt(lag.late)} of ${fmtInt(lag.n)}; ${fmtInt(lag.sameDay)} same day).` : ""}${ref.blockers.length ? " Capacity and previous-month lines are hidden under a Project, Ticket or Search filter." : ""}${ref.prevNote ? " " + esc(ref.prevNote) : ""}`.trim();
      const caption = captionText ? `<p class="tt-trend-caption">${captionText}</p>` : "";
      const rows = pts.map((p) => `<tr><td>${esc(p.label || fmtIsoDate(p.day))}</td><td class="num">${fmtHours(p.hours)}</td>${ref.capacityFor ? `<td class="num">${fmtHours(p.cap)}</td>` : ""}${ref.ghost ? `<td class="num">${p.ghost === null ? "–" : fmtHours(p.ghost)}</td>` : ""}<td>${esc([p.offLabel, p.filling ? "Still filling" : ""].filter(Boolean).join(" · "))}</td></tr>`).join("");
      const table = `<details class="tt-trend-values"><summary>${ref.weekly ? "Weekly" : "Daily"} values</summary><div class="carbon-data-table-wrap"><table class="carbon-data-table cds--data-table"${csvNameAttr("tt-trend")}><thead><tr><th scope="col">${ref.weekly ? "Week" : "Day"}</th><th scope="col" class="num">Logged</th>${ref.capacityFor ? `<th scope="col" class="num">Capacity</th>` : ""}${ref.ghost ? `<th scope="col" class="num">${esc(ref.ghost.short)} (same workday #)</th>` : ""}<th scope="col">Note</th></tr></thead><tbody>${rows}</tbody></table></div></details>`;
      host.innerHTML = `${legend}<svg class="tt-trend" viewBox="0 0 ${W} ${H}" role="img" aria-labelledby="tt-trend-title tt-trend-desc"><title id="tt-trend-title">${ref.weekly ? "Weekly" : "Daily"} hours trend</title><desc id="tt-trend-desc">${esc(desc)}</desc>${svg}</svg>${caption}${table}`;
    }

    function renderMemberChart(members) {
      destroyChart(memberChart);
      memberChart = null;
      const host = document.getElementById("chart-member-comparison");
      if (!host) return;
      if (!members.length || typeof Charts === "undefined") {
        host.innerHTML = carbonEmptyState("No member hours in scope", "Clear chart or table filters to widen the scope.");
        return;
      }
      const data = members.map((row) => ({ group: row.label, value: row.amount }));
      host.innerHTML = "";
      memberChart = new Charts.DonutChart(host, {
        data: data,
        options: {
          title: "Hours by Team Member",
          theme: (window.__dlaTheme || "g100"),
          resizable: true,
          height: "100%",
          donut: { center: { label: "Total hours" }, alignment: "center" },
          pie: { labels: { enabled: false } },
          legend: { enabled: false },
          color: { scale: data.reduce((acc, d, i) => { acc[d.group] = CHART_COLORS[i % CHART_COLORS.length]; return acc; }, {}) },
          tooltip: { valueFormatter: (v) => v.toFixed(2) + "h" },
          accessibility: { svgAriaLabel: "Hours by team member donut chart" },
        },
      });
    }

    function ensureGridShell() {
      let root = document.getElementById("tt-root");
      if (!root) {
        const main = document.getElementById("main-content");
        if (main) {
          main.innerHTML = '<div id="tt-root" class="carbon-grid"></div>';
          root = document.getElementById("tt-root");
        }
      }
      return { root };
    }

    function render() {
      const shell = ensureGridShell();
      const root = shell.root;
      if (!root) return;
      const focusInfo = captureFocus(root);
      const filters = readFilters();
      rangeNotices = [];
      ttCsvPeriod = csvPeriodToken(filters);
      const entries = DATA.timeEntries.filter((row) => matches(row, filters));
      const totalHours = entries.reduce((sum, row) => sum + asNumber(row.hours), 0);
      /* TT4: hours by project sorted by value, like hours by member. */
      const projects = projectRows(entries);
      const projectTableRows = projects;
      const members = memberRows(entries);
      const days = dayRows(entries);
      const tickets = ticketRows(entries);
      const allCalendarDays = calendarDaysForFilters(filters);
      const complianceThroughDay = complianceSnapshotDay(DATA.timeEntries);
      /* B11: the compliance grid and Off-target follow the User filter. */
      const complianceMembers = filters.user !== "all" ? DATA.members.filter((member) => member.username === filters.user) : DATA.members;
      const compliance = complianceRows(DATA.timeEntries, complianceMembers, allCalendarDays, complianceThroughDay);
      const activeMembers = new Set(entries.map((row) => row.logged_by_username).filter(Boolean)).size;
      /* hu.dam 31/10: under a Project or Search filter (User = All) the divisor is the person-days of only the members with at least one matching log. */
      const contentFilterActive = filters.user === "all" && (filters.project !== "all" || Boolean(filters.search.trim()));
      const loggedUsers = new Set(entries.map((row) => row.logged_by_username).filter(Boolean));
      const scopeUsers = filters.user !== "all"
        ? [filters.user]
        : contentFilterActive
          ? DATA.members.map((member) => member.username).filter((username) => loggedUsers.has(username))
          : DATA.members.map((member) => member.username);
      const avgCap = yearAvgCapDay();
      const workdaysInScope = contentFilterActive && !scopeUsers.length ? 0 : allCalendarDays
        .filter((meta) => meta.weekday >= 1 && meta.weekday <= 5 && !specialOffdayLabel(meta.day) && (!avgCap || meta.day <= avgCap))
        .reduce((sum, meta) => sum + workdayWeight(meta.day, scopeUsers), 0);
      const futureWorkdays = avgCap ? allCalendarDays.filter((meta) => meta.day > avgCap && isWorkday(meta)).length : 0;
      const avgHoursPerDay = workdaysInScope ? totalHours / workdaysInScope : 0;
      const aheadCount = entries.filter(isLoggedAhead).length;
      const periodMin = normalizeDayKey(DATA.month.start);
      const periodMax = normalizeDayKey(isoDateAddDays(DATA.month.end, -1));
      const windowText = fmtIsoDate(filters.from !== "all" ? filters.from : periodMin).slice(0, 5) + "–" + fmtIsoDate(filters.to !== "all" ? filters.to : periodMax).slice(0, 5);
      const TT_ZONE_NOTE = "Every person-day is logged at exactly " + fmtHours(TARGET) + " h (or about half on a half-day leave), so these tiles show whether the timesheet is filled, not how much work was done. Hours by project and ticket show planned allocation, not measured effort.";
      const TT_LOGGED_NOTE = "Hours logged in Mantis TimeTracking by the Digital members, counted on the work day (expenditure date) inside " + windowText + ", under the current filters. Not the same as WC “Lifetime on ticket” or Prod “Logged on handoff days”.";
      const TT_AHEAD_NOTE = "Share of entries created before the work day ended (before " + TT_WORKDAY_END + " on the work day, or on an earlier date). A high share means hours are filled in as planned allocation rather than recorded after the work.";
      /* TT3 references: capacity (on-duty × target) and the previous month aligned by workday number. */
      const refBlockers = ["project", "ticket", "search"].filter((key) => filters[key] && filters[key] !== FILTER_DEFAULTS[key]);
      const trendRef = buildTrendReference(filters, refBlockers);
      if (YEAR) {
        trendRef.points = yearTrendSeries(filters, entries, trendRef);
        trendRef.weekly = allCalendarDays.length > 92;
      }
      const complianceGrid = YEAR && allCalendarDays.length > 31 ? complianceBuckets(allCalendarDays) : null;
      const complianceTitle = complianceGrid ? (complianceGrid.mode === "month" ? "Monthly" : "Weekly") : "Daily";
      const presetOptionsHtml = YEAR
        ? ["Month", "Quarter", "Year"].map((group) => `<optgroup label="${group}">${YEAR_PRESETS.filter((preset) => preset.group === group).map((preset) => `<option value="${esc(preset.id)}" ${filters.period === preset.id ? "selected" : ""}>${esc(preset.label)}</option>`).join("")}</optgroup>`).join("") + `<option value="custom" ${filters.period === "custom" ? "selected" : ""}>Custom range…</option>`
        : "";
      const options = {
        users: uniqueOptions(DATA.members.map((row) => ({ username: row.username, label: row.realname || row.username })), "username", "label"),
        /* Only projects with hours in the selected period; a selected project always stays listed. */
        projects: uniqueOptions(DATA.timeEntries.filter((row) => {
          const day = normalizeDayKey(row.day);
          return (filters.from === "all" || day >= filters.from) && (filters.to === "all" || day <= filters.to)
            || (filters.project !== "all" && row.project_name === filters.project);
        }), "project_name", "project_name"),
        days: allCalendarDays.map((meta) => ({ value: meta.day, label: compactDate(meta.day) }))
      };
      const selectedTicket = filters.ticket !== "all" ? String(filters.ticket) : "";
      const selectedEntries = selectedTicket ? entries.filter((row) => String(row.bug_id) === selectedTicket) : [];
      const detailBase = selectedEntries[0] || tickets.find((row) => String(row.bugId) === selectedTicket) || null;

      const activeFilterKeys = activeFilterKeysFor(filters);
      const filterScope = filterScopeText(filters, activeFilterKeys);
      const ttEmbedded = document.documentElement.classList.contains("dla-embedded");
      const filteredBannerHtml = ttEmbedded
        ? ""
        : filterScope
          ? `<section class="tt-filtered-banner" id="tt-filtered-indicator" aria-label="Filter scope" title="Filtered: ${esc(filterScope)}"><span class="tt-filtered-banner__tag">Filtered:</span><span class="tt-filtered-banner__text" id="tt-filtered-text">${esc(filterScope)}</span></section>`
          : `<section class="tt-filtered-banner tt-filtered-banner--idle" aria-hidden="true"><span class="tt-filtered-banner__tag">Filtered:</span><span class="tt-filtered-banner__text"></span></section>`;

      /* One Reset for every filter, shown only when something is filtered (hidden in the CC frame). */
      const resetButtonHtml = `<button type="button" class="carbon-btn carbon-btn--ghost tt-reset" id="reset-filters" aria-label="Reset all filters"${activeFilterKeys.length ? "" : " hidden"}>Reset</button>`;
      /* Legend: "Pending" and "Not yet on team" only when the current grid has such cells. */
      const legendNeeds = { notyet: false, pending: false };
      if (complianceGrid) {
        compliance.forEach((row) => complianceGrid.buckets.forEach((bucket) => {
          const cls = aggregateComplianceCell(row, bucket).cls;
          if (cls in legendNeeds) legendNeeds[cls] = true;
        }));
      } else {
        compliance.forEach((row) => row.days.forEach((item) => {
          if (item.isNotYet) legendNeeds.notyet = true;
          else if (!item.isLeave && !item.isHalfLeave && !item.isOffday && item.isPending) legendNeeds.pending = true;
        }));
      }
      /* A member picked in User who had not joined by the end of the range: say so instead of 0.00. */
      const avgNotYetFrom = filters.user !== "all" ? memberActiveFrom(filters.user) : "";
      const avgRangeEnd = filters.to !== "all" ? filters.to : periodMax;
      const avgNotYet = Boolean(avgNotYetFrom) && avgNotYetFrom > avgRangeEnd;

      const forecastWorkloadHtml = (() => {
        const fw = DATA.forecastWorkload;
        if (!fw) return "";
        const cols = fw.columns || [];
        const prev = fw.previewRows || [];
        const head = cols.length ? `<tr>${cols.map((c) => `<th scope="col">${esc(c)}</th>`).join("")}</tr>` : "";
        const colSpan = Math.max(1, cols.length);
        const body = prev.length
          ? prev.map((row) => `<tr>${cols.map((c) => `<td>${esc(row[c] != null ? row[c] : "")}</td>`).join("")}</tr>`).join("")
          : `<tr><td colspan="${colSpan}">${carbonEmptyState("No rows in CSV preview", "The forecast CSV has no preview rows to display.")}</td></tr>`;
        return `
        <section class="forecast-snippet-wrap carbon-tile">
          <div class="panel-head">
            <h2 class="carbon-data-table-container__title">Forecast workload (CSV)</h2>
            <div class="panel-note">${esc(fw.sourcePath || "")}</div>
          </div>
          <p class="forecast-disclaimer">Supplementary model output for planning only; not a commitment or booking instruction. Confirm with the forecasting pipeline and owning team before acting on these figures.</p>
          ${carbonDataTableShell("Forecast preview", head, body, "", "", "tt-forecast")}
        </section>`;
      })();

      function filterChipLabel(key, value) {
        if (key === "period") { const preset = yearPresetById(value); return preset ? preset.label : value; }
        if ((key === "from" || key === "to" || key === "day") && value && value !== "all") return fmtIsoDate(value);
        return value;
      }

      const filterTagsHtml = activeFilterKeys.length
        ? activeFilterKeys.map((key) => `<span class="carbon-filter-tag"><span class="carbon-filter-tag__label">${esc(FILTER_CHIP_NAMES[key] || key)}: ${esc(filterChipLabel(key, filters[key]))}</span><button type="button" class="carbon-filter-tag__dismiss" data-clear="${esc(key)}" aria-label="Remove ${esc(FILTER_CHIP_NAMES[key] || key)} filter">×</button></span>`).join("")
        : `<span class="chips-hint">Click any chart, project row, compliance cell, or ticket row to drill down.</span>`;

      const projectTableHead = `<tr><th scope="col">Project</th><th scope="col" class="num">Hours</th><th scope="col" class="num">% of total</th></tr>`;
      const projectTableBody = projectTableRows.length
        ? projectTableRows.map((row, i) => { const c = CHART_COLORS[i % CHART_COLORS.length]; return `<tr class="clickable ${filters.project === row.value ? "active-row" : ""}" data-project-row="${esc(row.value)}" style="border-left:4px solid ${c};background:${c}18"><td>${esc(row.label)}</td><td class="num">${fmtHours(row.amount)}</td><td class="num">${fmtPct(row.percent)}</td></tr>`; }).join("")
        : `<tr><td colspan="3">${carbonEmptyState("No project hours in scope", "Clear chart or table filters to widen the scope.")}</td></tr>`;

      function projectHeaderSelect(id) {
        const active = filters.project !== "all";
        return `<th scope="col" class="tt-th-filterable${active ? " is-filtered" : ""}"><span class="tt-th-label" id="${esc(id)}-label">Project</span><select id="${esc(id)}" class="tt-th-filter" aria-labelledby="${esc(id)}-label" aria-label="Filter by project / Lọc theo dự án" title="Filter by project / Lọc theo dự án"><option value="all">All projects</option>${options.projects.map((opt) => `<option value="${esc(opt.value)}" ${filters.project === opt.value ? "selected" : ""}>${esc(opt.label)}</option>`).join("")}</select></th>`;
      }

      const ticketTableHead = `<tr><th scope="col">Ticket</th>${projectHeaderSelect("filter-project-ticket-header")}<th scope="col">Summary</th><th scope="col" class="num">Hours</th></tr>`;
      const ticketTableBody = tickets.length
        ? tickets.slice(0, 20).map((row) => `<tr class="clickable ${selectedTicket === String(row.bugId) ? "active-row" : ""}" data-ticket="${esc(row.bugId)}"><td>#${esc(row.bugId)}</td><td>${esc(row.project)}</td><td>${esc(row.summary)}</td><td class="num">${fmtHours(row.hours)}</td></tr>`).join("")
        : `<tr><td colspan="4">${carbonEmptyState("No tickets in scope", "Clear chart or table filters to widen the scope.")}</td></tr>`;

      const entryTableHead = `<tr><th scope="col">Day</th><th scope="col">User</th><th scope="col">Ticket</th>${projectHeaderSelect("filter-project-header")}<th scope="col" class="num">Hours</th><th scope="col">Category</th><th scope="col">Info</th><th scope="col">Created</th></tr>`;
      const entryRowHtml = (row) => `<tr class="clickable ${selectedTicket && String(row.bug_id) === selectedTicket ? "active-row" : ""}" data-ticket="${esc(row.bug_id || "")}"><td>${esc(fmtIsoDate(row.day))}</td><td>${esc(row.logged_by_name || row.logged_by_username)}</td><td>${row.bug_id ? "#" + esc(row.bug_id) : ""}</td><td>${esc(row.project_name)}</td><td class="num">${fmtHours(row.hours)}</td><td>${esc(row.category)}</td><td>${esc(row.info)}</td><td>${esc(fmtIsoDateTime(row.created_timestamp))}</td></tr>`;
      const entryPageSig = JSON.stringify(Object.assign({}, filters, { ticket: "" })) + "|" + entries.length;
      /* E: locking then unlocking a ticket returns to the page the reader was on. */
      if (entryPageSig !== ttPage.sig) {
        if (ttPage.sig) ttPage.saved[ttPage.sig] = ttPage.page;
        ttPage.sig = entryPageSig;
        ttPage.page = ttPage.saved[entryPageSig] || 1;
      }
      let entryWin = ttPageWindow(entries.length);
      const entryPageBody = () => entries.length
        ? entries.slice(entryWin.start, entryWin.end).map(entryRowHtml).join("")
        : `<tr><td colspan="8">${carbonEmptyState("No time entries match the current filters", "Clear chart or table filters to widen the scope.")}</td></tr>`;
      const entryTableBody = entryPageBody();

      /* Swapping the markup removes a focused Ticket field, and Chrome fires its change event
         right then; the handler must not commit that half-typed value (R7). */
      ttSwappingDom = true;
      queueMicrotask(() => { ttSwappingDom = false; });
      root.innerHTML = `
        ${filteredBannerHtml}
        ${forecastWorkloadHtml}
        <section class="carbon-tile tt-toolbar${YEAR ? " tt-toolbar--year" : ""}" aria-label="Filters">
          ${YEAR ? `<div class="control tt-period-control">
            <label for="filter-preset">Period</label>
            <div class="tt-range-row">
              <select id="filter-preset" aria-describedby="tt-year-note">${presetOptionsHtml}</select>
              ${resetButtonHtml}
            </div>
          </div>` : ""}
          <div class="control">
            <label for="filter-user">User</label>
            <select id="filter-user">
              <option value="all">All users</option>
              ${options.users.map((opt) => `<option value="${esc(opt.value)}" ${filters.user === opt.value ? "selected" : ""}>${esc(opt.label)}</option>`).join("")}
            </select>
          </div>
          <div class="control">
            <label for="filter-project">Project</label>
            <select id="filter-project">
              <option value="all">All projects</option>
              ${options.projects.map((opt) => `<option value="${esc(opt.value)}" ${filters.project === opt.value ? "selected" : ""}>${esc(opt.label)}</option>`).join("")}
            </select>
          </div>
          <div class="control">
            <label for="filter-from">From</label>
            <input type="text" id="filter-from" readonly placeholder="Start (dd/mm/yyyy)" autocomplete="off" />
          </div>
          <div class="control">
            <label for="filter-to">To</label>
            <input type="text" id="filter-to" readonly placeholder="End (dd/mm/yyyy)" autocomplete="off" />
          </div>
          ${YEAR ? "" : resetButtonHtml}
          <div class="control tt-ticket-control">
            <label for="filter-ticket">Ticket</label>
            <input id="filter-ticket" value="${filters.ticket === "all" ? "" : esc(filters.ticket)}" placeholder="Ticket ID">
          </div>
          <div class="control tt-search-control">
            <label for="filter-search">Search</label>
            <input id="filter-search" value="${esc(filters.search)}" placeholder="Project, ticket, note...">
          </div>
          ${YEAR ? `<p class="tt-year-note" id="tt-year-note">${esc(YEAR.note || "")} Published range: ${esc(fmtIsoDate(YEAR.firstDay))} – ${esc(fmtIsoDate(YEAR.lastDay))}.</p>` : ""}
        </section>

        <section class="carbon-filter-summary tt-chips" role="region" aria-label="Active filters">
          <span class="carbon-filter-summary__label">Filters:</span>
          ${filterTagsHtml}
        </section>

        <section class="tt-metrics" aria-labelledby="tt-metrics-title">
          <h2 class="tt-metrics__title" id="tt-metrics-title">Timesheet compliance${ttTip(TT_ZONE_NOTE, "About Timesheet compliance")}<span class="tt-metrics__title-note">Is the timesheet filled to ${fmtHours(TARGET)} h per workday?</span></h2>
          ${ttTipTile("Logged (" + periodShortFor(filters) + ")", fmtHours(totalHours), `${fmtInt(entries.length)} ${entries.length === 1 ? "entry" : "entries"} · ${windowText}`, TT_LOGGED_NOTE, "Definition of Logged", "logged")}
          ${avgNotYet ? carbonKpiInfoTile("Avg Hours / Day", "Not yet", "Not yet on team · joined " + fmtIsoDate(avgNotYetFrom), "This member joined the team on " + fmtIsoDate(avgNotYetFrom) + ", after the selected period, so there are no workdays to average." + AVG_NOT_YET_NOTE, "tt-avg-info").replace('class="carbon-tile carbon-tile--span-4 carbon-kpi"', 'class="carbon-tile carbon-tile--span-4 carbon-kpi tt-kpi--notyet"') : carbonKpiInfoTile("Avg Hours / Day", fmtHours(avgHoursPerDay), `${fmtWorkdays(workdaysInScope)} ${scopeUsers.length > 1 ? "person-days" : "workdays"} in scope${contentFilterActive ? ` · ${fmtInt(scopeUsers.length)} of ${fmtInt(DATA.members.length)} members with logs` : ""}${futureWorkdays ? ` · ${fmtInt(futureWorkdays)} future workdays not counted` : ""}`, (contentFilterActive ? AVG_FILTERED_RULE_NOTE : scopeUsers.length > 1 ? AVG_TEAM_RULE_NOTE : AVG_RULE_NOTE) + (YEAR ? AVG_YEAR_NOTE : hasNotYetInScope() ? AVG_NOT_YET_NOTE : ""), "tt-avg-info")}
          ${ttTipTile("Logged ahead", entries.length ? fmtPct(aheadCount / entries.length * 100) : "–", `${fmtInt(aheadCount)} of ${fmtInt(entries.length)} ${entries.length === 1 ? "entry" : "entries"} created before ${TT_WORKDAY_END} on the work day`, TT_AHEAD_NOTE, "Definition of Logged ahead", "logged_ahead")}
          ${carbonKpiTile("Active Members", fmtInt(activeMembers), `Out of ${fmtInt(DATA.summary.matched_members)} matched`)}
          ${carbonKpiTile("Projects", fmtInt(projects.length), "Projects with booked hours")}
          ${carbonKpiTile("Off-target Hours", fmtHours(compliance.reduce((sum, row) => sum + row.offTargetHours, 0)), `Target ${fmtHours(TARGET)}h per workday`)}
        </section>

        <section class="carbon-tile tt-compliance-panel">
          <div class="panel-head">
            <h2 class="carbon-data-table-container__title">${complianceTitle} ${fmtHours(TARGET)}h Compliance by Member</h2>
            <div class="compliance-legend panel-note">
              ${carbonStatusBadge("success", "Exactly " + fmtHours(TARGET) + "h")}
              ${carbonStatusBadge("error", "Not exactly " + fmtHours(TARGET) + "h")}
              ${carbonStatusBadge("info", "Leave Day")}
              ${carbonStatusBadge("info", "Half Leave · 3.50–4.50h")}
              ${carbonStatusBadge("neutral", "Weekend / Public Holiday")}
              ${legendNeeds.pending ? carbonStatusBadge("pending", "Pending future workday") : ""}
              ${legendNeeds.notyet ? carbonStatusBadge("neutral", "Not yet on team (hatched)") : ""}
            </div>
          </div>
          ${complianceGrid || ttDrillBack ? `<div class="tt-agg-bar">${complianceGrid ? `<p class="panel-note tt-agg-note">${complianceGrid.mode === "month" ? "Monthly" : "Weekly"} cells: hours logged in the ${complianceGrid.mode === "month" ? "month" : "week"} against the hours expected (${fmtHours(TARGET)} h per workday on duty). Red when any workday is off target. Click a cell or a column heading to see its days.</p>` : ""}${ttDrillBack ? `<button type="button" class="carbon-btn carbon-btn--ghost tt-drill-back" id="tt-drill-back">← Back to ${esc(ttDrillBack.label)}</button>` : ""}</div>` : ""}
          ${complianceGrid ? aggregatedComplianceHtml(compliance, complianceGrid, filters) : `<div class="compliance-wrap">
            <table class="compliance carbon-data-table"${csvNameAttr("tt-daily")} aria-label="Daily compliance by member">
              <colgroup>
                <col class="user-col">
                ${allCalendarDays.map(() => `<col class="day-col">`).join("")}
              </colgroup>
              <thead>
                <tr>
                  <th scope="col">User</th>
                  ${allCalendarDays.map((meta) => `<th scope="col" class="tt-day-head" title="${esc(fmtIsoDate(meta.day))}" aria-label="${esc(fmtIsoDate(meta.day))}">${esc(ddMm(meta.day))}</th>`).join("")}
                </tr>
              </thead>
              <tbody>
                ${compliance.map((row) => `<tr><th scope="row">${esc(row.name)}</th>${row.days.map((item) => {
                  const active = filters.user === row.username && isDaySelected(filters, item.day);
                  let cellClass;
                  if (item.isNotYet) {
                    cellClass = "notyet";
                  } else if (item.isLeave) {
                    cellClass = "leave";
                  } else if (item.isHalfLeave) {
                    cellClass = "leave half " + (item.halfLeaveOnTarget ? "half-ok" : "half-miss");
                  } else if (item.isOffday) {
                    cellClass = "offday";
                  } else if (item.isPending) {
                    cellClass = "pending";
                  } else {
                    cellClass = item.onTarget ? "ok" : "miss";
                  }
                  let cellLabel;
                  if (item.isNotYet) {
                    cellLabel = "Not yet";
                  } else if (item.isLeave) {
                    cellLabel = "Leave Day";
                  } else if (item.isHalfLeave) {
                    cellLabel = fmtHours(item.hours);
                  } else if (item.isOffday) {
                    cellLabel = "—";
                  } else if (item.isPending) {
                    cellLabel = "Pending";
                  } else if (item.hours <= 0) {
                    cellLabel = "No hours";
                  } else {
                    cellLabel = fmtHours(item.hours);
                  }
                  const gapRaw = item.isHalfLeave ? "Half Leave" : (item.gapLabel || "");
                  const gapText = esc(gapRaw);
                  const showGap = item.isHalfLeave || (
                    Boolean(gapRaw)
                    && gapRaw !== cellLabel
                    && !item.onTarget
                    && !item.isLeave
                    && !item.isOffday
                    && !item.isPending
                    && cellLabel !== "No hours"
                    && /^(Over by|Short by)/.test(gapRaw)
                  );
                  const tip = item.isHalfLeave ? (item.gapLabel || gapRaw) : (gapRaw || cellLabel);
                  const aria = `${esc(row.name)} ${esc(compactDate(item.day))}: ${esc(tip)}`;
                  return `<td data-dla-csv-value="${esc(complianceCsvValue(item, cellLabel))}"><button type="button" class="cell-button ${cellClass} ${active ? "active" : ""}" data-user-day="${esc(row.username)}|${esc(item.day)}" title="${esc(tip)}" aria-label="${aria}"><div class="cell-hours">${cellLabel}</div>${showGap ? `<div class="cell-gap">${gapText}</div>` : ""}</button></td>`;
                }).join("")}</tr>`).join("")}
              </tbody>
            </table>
          </div>`}
        </section>

        <section class="carbon-tile tt-project">
          <div class="tt-project-grid">
            <div class="tt-project-chart">
              ${carbonChartShell("chart-project-hours", "Hours by Project", "100%")}
            </div>
            <div class="tt-project-table">
              <div class="carbon-data-table-wrap"><table class="carbon-data-table cds--data-table"${csvNameAttr("tt-projects")}><thead>${projectTableHead}</thead><tbody>${projectTableBody}</tbody></table></div>
            </div>
          </div>
        </section>

        <section class="carbon-tile tt-project tt-member-section">
          <div class="tt-project-grid">
            <div class="tt-project-chart">
              ${carbonChartShell("chart-member-comparison", "Hours by Team Member", "100%")}
            </div>
            <div class="tt-project-table">
              <div class="carbon-data-table-wrap"><table class="carbon-data-table cds--data-table"${csvNameAttr("tt-members")}><thead><tr><th scope="col">Member</th><th scope="col" class="num">Hours</th><th scope="col" class="num">% of total</th></tr></thead><tbody>${members.length ? members.map((row, i) => { const c = CHART_COLORS[i % CHART_COLORS.length]; const pct = totalHours ? (row.amount / totalHours * 100) : 0; return `<tr class="clickable" data-member-row="${esc(row.value)}" style="border-left:4px solid ${c};background:${c}18"><td>${esc(row.label)}</td><td class="num">${fmtHours(row.amount)}</td><td class="num">${fmtPct(pct)}</td></tr>`; }).join("") : `<tr><td colspan="3">${carbonEmptyState("No members in scope", "")}</td></tr>`}</tbody></table></div>
            </div>
          </div>
        </section>

        <section class="carbon-tile tt-breakdown">
          ${carbonChartShell("chart-daily-trend", (trendRef.weekly ? "Weekly" : "Daily") + " hours trend", "auto")}
          <div class="panel-note" style="margin-top:8px">Click a compliance day cell to filter by date range.</div>
        </section>

        <section class="carbon-tile tt-breakdown">
          ${carbonDataTableShell("By Ticket", ticketTableHead, ticketTableBody, "Click a ticket row to lock the detail panel", "", "tt-tickets")}
        </section>

        <section class="carbon-tile tt-entries">
          ${carbonDataTableShell("Time Tracking Details", entryTableHead, entryTableBody, "Every filtered Mantis time entry. Click a row to lock the ticket detail.", ttPaginationHtml(entries.length, entryWin), "tt-details")}
        </section>
      `;

      renderProjectChart(projects, filters);
      renderDailyTrendChart(YEAR ? trendRef.points : days, trendRef);
      renderMemberChart(members);

      function setFilter(key, value) {
        /* R19: read the current filters, not this render's snapshot, so a deferred Ticket commit
           and the Search debounce never undo each other. */
        const next = Object.assign({}, readFilters(), { [key]: value });
        writeFilters(next);
        render();
      }

      document.getElementById("filter-user").addEventListener("change", (event) => setFilter("user", event.target.value));
      const presetSelect = document.getElementById("filter-preset");
      if (presetSelect) presetSelect.addEventListener("change", (event) => {
        ttDrillBack = null;
        const value = event.target.value;
        if (value === "custom") {
          writeFilters(Object.assign({}, filters, { period: "custom" }));
          render();
          const fromField = document.getElementById("filter-from");
          if (fromField) fromField.focus({ preventScroll: true });
          return;
        }
        const preset = yearPresetById(value);
        if (!preset) return;
        writeFilters(Object.assign({}, filters, { period: preset.id, from: preset.from, to: preset.to }));
        render();
      });
      const drillTo = (next) => {
        const preset = activeYearPreset(filters);
        ttDrillBack = { filters: Object.assign({}, filters), label: preset ? preset.label : filterRangeText(filters) };
        writeFilters(normalizeRangeFilters(Object.assign({}, next, { period: "auto" })));
        render();
        const back = document.getElementById("tt-drill-back");
        if (back) back.focus({ preventScroll: true });
      };
      root.querySelectorAll("[data-user-range]").forEach((node) => node.addEventListener("click", () => {
        const [user, from, to] = node.dataset.userRange.split("|");
        drillTo(Object.assign({}, filters, { user: user, from: from, to: to }));
      }));
      root.querySelectorAll("[data-range]").forEach((node) => node.addEventListener("click", () => {
        const [from, to] = node.dataset.range.split("|");
        drillTo(Object.assign({}, filters, { from: from, to: to }));
      }));
      const drillBack = document.getElementById("tt-drill-back");
      if (drillBack) drillBack.addEventListener("click", () => {
        const back = ttDrillBack ? ttDrillBack.filters : FILTER_DEFAULTS;
        ttDrillBack = null;
        writeFilters(back);
        render();
        const target = document.getElementById("filter-preset");
        if (target) target.focus({ preventScroll: true });
      });
      const avgInfoBtn = document.getElementById("tt-avg-info");
      if (avgInfoBtn) {
        const avgInfoWrap = avgInfoBtn.parentNode;
        const setAvgInfo = (open) => {
          avgInfoOpen = open;
          avgInfoWrap.classList.toggle("is-open", open);
          avgInfoWrap.classList.remove("is-dismissed");
          avgInfoBtn.setAttribute("aria-expanded", open ? "true" : "false");
        };
        /* Keep the note inside the viewport (narrow screens put this tile in the right column). */
        const avgInfoTip = document.getElementById("tt-avg-info-tip");
        const placeAvgInfo = () => {
          avgInfoTip.style.transform = "";
          const rect = avgInfoTip.getBoundingClientRect();
          if (!rect.width) return;
          const overflow = rect.right - (document.documentElement.clientWidth - 8);
          if (overflow > 0) avgInfoTip.style.transform = `translateX(${-Math.min(overflow, Math.max(0, rect.left - 8))}px)`;
        };
        ["mouseenter", "focusin", "click"].forEach((type) => avgInfoWrap.addEventListener(type, () => requestAnimationFrame(placeAvgInfo)));
        if (avgInfoOpen) requestAnimationFrame(placeAvgInfo);
        avgInfoBtn.addEventListener("click", (event) => { event.stopPropagation(); setAvgInfo(!avgInfoOpen); });
        avgInfoWrap.addEventListener("keydown", (event) => {
          if (event.key !== "Escape") return;
          setAvgInfo(false);
          avgInfoWrap.classList.add("is-dismissed");
        });
        avgInfoWrap.addEventListener("mouseleave", () => avgInfoWrap.classList.remove("is-dismissed"));
        avgInfoBtn.addEventListener("blur", () => avgInfoWrap.classList.remove("is-dismissed"));
      }
      document.getElementById("filter-project").addEventListener("change", (event) => setFilter("project", event.target.value));
      root.querySelectorAll("select.tt-th-filter").forEach((node) => {
        node.addEventListener("click", (event) => event.stopPropagation());
        node.addEventListener("change", (event) => setFilter("project", event.target.value));
      });
      const bounds = periodBounds();
      const fromInput = document.getElementById("filter-from");
      const toInput = document.getElementById("filter-to");
      setDateInputDisplay(fromInput, filters.from === "all" ? "" : filters.from);
      setDateInputDisplay(toInput, filters.to === "all" ? "" : filters.to);
      bindDdMmDatePicker(fromInput, (iso) => {
        lastRangeSwapped = false;
        const next = normalizeRangeFilters(Object.assign({}, filters, { from: iso || "all" }));
        writeFilters(next);
        announceFilterStatus(lastRangeSwapped ? "To date was before From – swapped." : "");
        lastRangeSwapped = false;
        render();
      }, {
        placeholder: "Start (dd/mm/yyyy)",
        clearable: true,
        label: "From",
        min: bounds.min,
        max: filters.to !== "all" && filters.to < bounds.max ? filters.to : bounds.max,
      });
      bindDdMmDatePicker(toInput, (iso) => {
        lastRangeSwapped = false;
        const next = normalizeRangeFilters(Object.assign({}, filters, { to: iso || "all" }));
        writeFilters(next);
        announceFilterStatus(lastRangeSwapped ? "To date was before From – swapped." : "");
        lastRangeSwapped = false;
        render();
      }, {
        placeholder: "End (dd/mm/yyyy)",
        clearable: true,
        label: "To",
        min: filters.from !== "all" && filters.from > bounds.min ? filters.from : bounds.min,
        max: bounds.max,
      });
      const ticketInput = document.getElementById("filter-ticket");
      ticketInput.addEventListener("input", (event) => { inputDrafts["filter-ticket"] = event.target.value; });
      const commitTicket = (event, immediate) => {
        /* A re-render that removes the focused field fires change; keep the text as a draft
           (restored after render) instead of committing it half-typed. */
        if (ttSwappingDom || !event.target.isConnected) return;
        const value = event.target.value.trim() || "all";
        clearTimeout(ticketCommitTimer);
        const run = () => {
          ticketCommitTimer = 0;
          inputDrafts["filter-ticket"] = null;
          if ((readFilters().ticket || "all") === value) return;
          setFilter("ticket", value);
        };
        /* R19: change / blur fire while focus is still moving (Tab or a click on Search), when
           document.activeElement is the old field or body. Committing then re-rendered the toolbar
           and dropped focus and the Search text. Defer one task so the re-render captures the
           field the user moved to (focus, caret and both values are then restored). */
        if (immediate) run(); else ticketCommitTimer = setTimeout(run, 0);
      };
      ticketInput.addEventListener("change", (event) => commitTicket(event, false));
      /* A restored draft is not a user edit, so Enter / leaving the field would not fire change. */
      ticketInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") commitTicket(event, true);
      });
      ticketInput.addEventListener("blur", (event) => {
        if (inputDrafts["filter-ticket"] != null) commitTicket(event, false);
      });
      document.getElementById("filter-search").addEventListener("input", (event) => {
        const value = event.target.value;
        inputDrafts["filter-search"] = value;
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
          if (inputDrafts["filter-search"] === value) inputDrafts["filter-search"] = null;
          setFilter("search", value);
        }, SEARCH_DEBOUNCE_MS);
      });
      document.getElementById("reset-filters").addEventListener("click", () => {
        clearTimeout(searchTimer);
        inputDrafts["filter-ticket"] = null;
        inputDrafts["filter-search"] = null;
        ttDrillBack = null;
        writeFilters(FILTER_DEFAULTS);
        announceFilterStatus("");
        render();
        const target = document.getElementById("filter-preset") || document.getElementById("filter-from");
        if (target) target.focus({ preventScroll: true });
      });
      root.querySelectorAll("[data-clear]").forEach((node) => node.addEventListener("click", () => {
        const key = node.dataset.clear;
        if (YEAR && (key === "period" || key === "from" || key === "to")) {
          ttDrillBack = null;
          const next = key === "period"
            ? Object.assign({}, filters, { period: FILTER_DEFAULTS.period, from: FILTER_DEFAULTS.from, to: FILTER_DEFAULTS.to })
            : Object.assign({}, filters, { [key]: "all", period: "auto" });
          writeFilters(normalizeRangeFilters(next));
          render();
          return;
        }
        if (key === "ticket" || key === "search") {
          if (key === "search") clearTimeout(searchTimer);
          inputDrafts["filter-" + key] = null;
        }
        setFilter(key, FILTER_DEFAULTS[key]);
      }));
      root.querySelectorAll("[data-project-row]").forEach((node) => node.addEventListener("click", () => setFilter("project", filters.project === node.dataset.projectRow ? "all" : node.dataset.projectRow)));
      root.querySelectorAll("[data-user-day]").forEach((node) => node.addEventListener("click", () => {
        const [user, day] = node.dataset.userDay.split("|");
        const same = filters.user === user && filters.from === day && filters.to === day;
        const next = Object.assign({}, filters, {
          user: same ? "all" : user,
          from: same ? FILTER_DEFAULTS.from : day,
          to: same ? FILTER_DEFAULTS.to : day
        }, YEAR ? { period: same ? FILTER_DEFAULTS.period : "auto" } : {});
        writeFilters(normalizeRangeFilters(next));
        render();
      }));
      const bindTicketRows = (scope) => scope.querySelectorAll("[data-ticket]").forEach((node) => node.addEventListener("click", () => setFilter("ticket", filters.ticket === node.dataset.ticket ? "all" : node.dataset.ticket || "all")));
      bindTicketRows(root);

      /* Details pagination: repaint only the details tbody + bar; CSV export reads the full filtered set. */
      const entriesSection = root.querySelector(".tt-entries");
      const entriesTable = entriesSection && entriesSection.querySelector("table");
      if (entriesTable) {
        entriesTable.dlaCsvSource = () => {
          if (!entries.length) return null;
          const full = document.createElement("table");
          full.innerHTML = `<caption>Time Tracking Details</caption><thead>${entryTableHead}</thead><tbody>${entries.map(entryRowHtml).join("")}</tbody>`;
          return full;
        };
        const wirePagination = (focusSel) => {
          const bar = entriesSection.querySelector(".dla-pagination");
          if (!bar) return;
          const repaint = (sel) => {
            entryWin = ttPageWindow(entries.length);
            const tbody = entriesTable.querySelector("tbody");
            tbody.innerHTML = entryPageBody();
            bindTicketRows(tbody);
            bar.outerHTML = ttPaginationHtml(entries.length, entryWin);
            wirePagination(sel);
            if (window.dlaMotion) window.dlaMotion.swap(tbody);
            const reducedMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
            if (entriesSection.getBoundingClientRect().top < 0) entriesSection.scrollIntoView({ block: "start", behavior: reducedMotion ? "auto" : "smooth" });
          };
          const pages = entryWin.pages;
          bar.querySelector("#dla-pg-size").addEventListener("change", (event) => { ttPage.size = Number(event.target.value); ttPage.page = 1; repaint("#dla-pg-size"); });
          bar.querySelector("#dla-pg-page").addEventListener("change", (event) => { ttPage.page = Number(event.target.value); repaint("#dla-pg-page"); });
          bar.querySelector("#dla-pg-prev").addEventListener("click", () => { ttPage.page -= 1; repaint(ttPage.page <= 1 ? "#dla-pg-next" : "#dla-pg-prev"); });
          bar.querySelector("#dla-pg-next").addEventListener("click", () => { ttPage.page += 1; repaint(ttPage.page >= pages ? "#dla-pg-prev" : "#dla-pg-next"); });
          if (focusSel) { const target = entriesSection.querySelector(focusSel); if (target) target.focus(); }
        };
        wirePagination("");
      }
      restoreInputDrafts();
      restoreFocus(focusInfo);
      postFilterState(filters, filterScope);
    }

    /* B3: the Control Center's Reset asks this frame to clear its filters. */
    window.addEventListener("message", (event) => {
      if (window.parent === window || event.source !== window.parent) return;
      if (location.protocol !== "file:" && event.origin !== location.origin) return;
      if (!event.data || event.data.type !== "dla-tt-filter-reset") return;
      clearTimeout(searchTimer);
      inputDrafts["filter-ticket"] = null;
      inputDrafts["filter-search"] = null;
      ttDrillBack = null;
      writeFilters(FILTER_DEFAULTS);
      announceFilterStatus("");
      render();
    });

    /* Bad, out-of-period, or From > To values from the URL or saved state are fixed once,
       announced, stored, and the URL rewritten (B6, B7, B9). */
    lastRangeSwapped = false;
    rangeNotices = [];
    const initialFilters = readFilters();
    const initialNotices = rangeNotices.slice();
    if (lastRangeSwapped) initialNotices.push("To date was before From – swapped.");
    /* A legacy ?day= link is rewritten to From/To. */
    const legacyDayParam = new URLSearchParams(window.location.search).has("day");
    if (initialNotices.length || legacyDayParam) writeFilters(initialFilters);
    lastRangeSwapped = false;
    rangeNotices = [];
    render();
    if (initialNotices.length) announceFilterStatus(initialNotices.join(" "));
  })();
  </script>
<script id="dla-theme-wire">
(function () {
  document.addEventListener("click", function (e) {
    var b = e.target && e.target.closest ? e.target.closest(".dla-theme-toggle") : null;
    if (!b || !window.dlaTheme) return;
    window.dlaTheme.set(window.__dlaTheme === "g10" ? "g100" : "g10");
  });
  var frame = document.getElementById("dashboardFrame");
  if (!frame) return;
  function post() {
    try { if (frame.contentWindow) frame.contentWindow.postMessage({ type: "dla-theme", theme: window.__dlaTheme }, location.origin); } catch (e) {}
  }
  window.addEventListener("dla-theme", post);
  frame.addEventListener("load", post);
})();
</script>
</body>
</html>
